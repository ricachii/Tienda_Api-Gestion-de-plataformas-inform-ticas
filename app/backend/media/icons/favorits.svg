<svg width="64px" height="64px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vitaHeartGradient" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9b5bff" />
      <stop offset="100%" stop-color="#8257E6" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#glow)" stroke="url(#vitaHeartGradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Corazón corregido y más armónico -->
    <path 
      d="M12 21
         C12 21 6 16.5 4.2 14.5
         C1.5 11.5 2 7 5 5.2
         C7.5 3.7 10.5 5 12 7
         C13.5 5 16.5 3.7 19 5.2
         C22 7 22.5 11.5 19.8 14.5
         C18 16.5 12 21 12 21Z"
      fill="none"
    />
  </g>
</svg>
